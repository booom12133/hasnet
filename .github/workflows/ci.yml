name: release-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev]
      - name: Audit release
        run: python scripts/audit_release.py
      - name: Test
        run: pytest -q
      - name: Check full-model profile
        run: python scripts/profile_model.py --config configs/paper/full_convnext.yaml

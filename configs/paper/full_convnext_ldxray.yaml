name: hasnet_full_convnext_ldxray
seed: 3408

data:
  dataset: ldxray
  root: .
  splits:
    train: splits/ldxray/train.txt
    val: splits/ldxray/val.txt
    test: splits/ldxray/test.txt
  num_classes: 12
  class_names: [MP, OL, PC1, LA, GL, PC2, TA, BL, CO, NL, UM, CG]
  image_size: 256
  num_workers: 32
  pin_memory: true
  persistent_workers: true
  paired_augmentation: independent

model:
  name: hasnet
  backbone: convnext
  pretrained: true
  fusion_dim_index: 2
  fpn_channels: 256
  act: silu
  use_vsc: true
  use_coordatt: true
  use_lka: true
  use_bifpn: true
  use_aux_gate: true

loss:
  name: asymmetric
  gamma_neg: 4.0
  gamma_pos: 0.0
  clip: 0.05
  aux_alpha: 0.7

train:
  epochs: 60
  global_batch_size: 64
  optimizer: adamw
  learning_rate: 0.00007
  weight_decay: 0.001
  grad_clip: 5.0
  amp: true
  deterministic: true
  drop_last: false
  ema:
    enabled: true
    decay: 0.9999
    warmup_updates: 2000
  scheduler:
    name: paper_v1
    warmup_epochs: 0
    warmup_updates: 1050
    eta_min_ratio: 0.01

evaluation:
  threshold: 0.5
  calibration_bins: 10
  tta: false
  checkpoint_weights: ema
  selection_start_epoch: 32

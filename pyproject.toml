[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hasnet-dvxray"
version = "0.2.0"
description = "Role-separated dual-view X-ray multi-label recognition"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Huizhen Jia"},
  {name = "Cailong Zhou"},
  {name = "Peng Fu"},
  {name = "Tonghan Wang", email = "thwang@ecut.edu.cn"},
]
dependencies = [
  "torch>=2.1,<2.7",
  "torchvision>=0.16,<0.22",
  "timm>=1.0,<1.1",
  "numpy>=1.24,<3",
  "pillow>=10,<12",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "thop>=0.1.1",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["hasnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
